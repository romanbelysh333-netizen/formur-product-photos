<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMUR | Фото товаров</title>
<style>
:root{color-scheme:light;--ink:#241d1b;--muted:#746963;--line:#e5d9ce;--paper:#f8f4ee;--wine:#773344}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:36px 20px 24px;background:#191716;color:#f3ebdd}main{max-width:1180px;margin:auto;padding:24px 18px 60px}h1{margin:0 0 8px;font-size:clamp(27px,4vw,42px)}header p{margin:0;color:#d8c9b9}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}input{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}a.download,button.copy{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:white;color:var(--wine);font:inherit;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}article{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:white}.cover{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#eee8e0}.body{padding:14px}.sku{font-size:12px;color:var(--muted);letter-spacing:.07em}h2{margin:3px 0 12px;font-size:19px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.thumb{width:100%;aspect-ratio:1;object-fit:contain;background:#f1ece5;border-radius:8px}.actions{display:grid;gap:7px;margin-top:12px}.copy{display:flex;justify-content:space-between;gap:8px;text-align:left}.copy span{color:var(--ink)}.copy small{color:var(--wine)}footer{padding:22px;text-align:center;color:var(--muted);font-size:13px}.notice{padding:12px 14px;margin-bottom:18px;border:1px solid #dfc8b8;border-radius:10px;background:#fffaf4;color:#65483a}
</style></head><body><header><main><h1>3D·FORMUR. | Фотографии товаров</h1><p>Каталог фотографий 11 наборов ёлочных украшений · 2027</p></main></header><main><div class="notice" id="notice">Загружаю каталог фотографий…</div><div class="bar"><input id="search" type="search" placeholder="Поиск по артикулу или названию"><a class="download" href="photo-links.csv" download>Скачать CSV для Excel</a></div><section class="grid" id="grid"></section></main><footer>Оригинальные фотографии товаров · Прямые ссылки на PNG</footer>
<script>
const grid=document.getElementById('grid'),notice=document.getElementById('notice'),search=document.getElementById('search');
function absolute(file){return new URL('photos/'+file,location.href).href}
function render(items){grid.innerHTML='';for(const x of items){const card=document.createElement('article');card.dataset.search=(x.sku+' '+x.name).toLowerCase();card.innerHTML='<a href="'+absolute(x.cover)+'" target="_blank" rel="noopener"><img class="cover" src="photos/'+x.cover+'" alt="'+x.name+'"></a><div class="body"><div class="sku">'+x.sku+'</div><h2>'+x.name+'</h2><div class="thumbs">'+[x.cover,x.set,x.dimensions].map(f=>'<a href="'+absolute(f)+'" target="_blank" rel="noopener"><img class="thumb" loading="lazy" src="photos/'+f+'" alt=""></a>').join('')+'</div><div class="actions">'+[[x.cover,'Главное фото'],[x.set,'Все 9 украшений'],[x.dimensions,'Размеры']].map(([f,label])=>'<button class="copy" data-file="'+f+'"><span>'+label+'</span><small>Копировать ссылку ↗</small></button>').join('')+'</div></div>';grid.append(card)}}
fetch('photos-manifest.json').then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).then(d=>{render(d.items);notice.textContent='Каталог загружен. Нажми «Копировать ссылку», чтобы получить прямой URL изображения.'}).catch(()=>{notice.textContent='Не найден photos-manifest.json. Проверь загрузку файлов в корень репозитория.'});
search.addEventListener('input',()=>{const q=search.value.toLowerCase();for(const card of grid.children)card.hidden=!card.dataset.search.includes(q)});
document.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;try{await navigator.clipboard.writeText(absolute(b.dataset.file));b.querySelector('small').textContent='Скопировано ✓';setTimeout(()=>b.querySelector('small').textContent='Копировать ссылку ↗',1500)}catch{prompt('Скопируй прямую ссылку:',absolute(b.dataset.file))}});
</script></body></html>
